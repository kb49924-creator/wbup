name: Build iOS IPA (Unsigned / Sideloadable)

"on":
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish IPA to GitHub Releases'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build & Package WB Up Studio .ipa
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Listing available Xcode versions..."
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_15.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Sync Web GUI Assets to iOS App
        run: |
          echo "Syncing web_gui/ to ios/WBUpStudio/www/..."
          mkdir -p ios/WBUpStudio/www
          rsync -av --delete \
            --exclude="__pycache__" \
            --exclude="*.py" \
            --exclude="*.log" \
            --exclude="*.bat" \
            --exclude="*.sh" \
            --exclude="data/images" \
            --exclude=".DS_Store" \
            web_gui/ ios/WBUpStudio/www/
          echo "Synced assets:"
          ls -la ios/WBUpStudio/www/

      - name: Build Xcode Archive (No Code Signing Required)
        run: |
          echo "Building iOS Archive..."
          mkdir -p build
          xcodebuild archive \
            -project ios/WBUpStudio.xcodeproj \
            -scheme WBUpStudio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/WBUpStudio.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload into .ipa
        run: |
          echo "Packaging WB_Up_Studio.ipa..."
          mkdir -p ipa_staging/Payload
          cp -R build/WBUpStudio.xcarchive/Products/Applications/WBUpStudio.app ipa_staging/Payload/
          cd ipa_staging
          zip -r -y ../WB_Up_Studio.ipa Payload
          cd ..
          ls -lh WB_Up_Studio.ipa

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WB_Up_Studio_ipa
          path: WB_Up_Studio.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release and Attach IPA
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          name: "WB Up Studio iOS ${{ github.ref_name || 'v2.3.0' }}"
          tag_name: ${{ github.ref_name || 'v2.3.0-ios' }}
          draft: false
          prerelease: false
          files: WB_Up_Studio.ipa
          body: |
            ## 📱 WB Up Studio iOS (.ipa)
            
            Автономная версия **WB Up Studio** для iPhone и iPad.
            
            ### Возможности релиза:
            - ⚡️ **Прямой опрос Wildberries API**: опрос продавцов и каталога напрямую без локального сервера.
            - 🎨 **HTML5 Canvas Студия 1080x1080**: вырезка фона, тени, плашки со скидками и ценами.
            - 🚀 **Telegram Bot API**: отправка постов с фото и inline-кнопками прямо с устройства.
            - 💾 **Автономное хранилище**: очередь и настройки хранятся локально.
            
            ### Установка:
            - **Sideloadly** (macOS / Windows): подключите iPhone по кабелю или Wi-Fi, перетащите `.ipa` и нажмите Start.
            - **AltStore**: откройте файл `WB_Up_Studio.ipa` через меню «Поделиться» в AltStore.
            - Подробная инструкция: см. [USAGE_IOS.md](USAGE_IOS.md).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
