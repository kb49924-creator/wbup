name: Build iOS IPA (Unsigned / Sideloadable)

"on":
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish IPA to GitHub Releases'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package WB Up Studio .ipa
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Xcode Version
        run: |
          echo "Active Xcode Version:"
          xcodebuild -version

      - name: Sync Web GUI Assets to iOS App
        run: |
          echo "Syncing web_gui/ to ios/WBUpStudio/www/..."
          mkdir -p ios/WBUpStudio/www
          rsync -av --delete \
            --exclude="__pycache__" \
            --exclude="*.py" \
            --exclude="*.log" \
            --exclude="*.bat" \
            --exclude="*.sh" \
            --exclude="data/images" \
            --exclude=".DS_Store" \
            web_gui/ ios/WBUpStudio/www/
          echo "Synced assets count: $(ls -1 ios/WBUpStudio/www | wc -l)"

      - name: Build WB Up Studio (.app)
        id: build_app
        run: |
          echo "Compiling Native iOS Application..."
          mkdir -p build/DerivedData
          xcodebuild clean build \
            -project ios/WBUpStudio.xcodeproj \
            -scheme WBUpStudio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

          APP_PATH=$(find build/DerivedData -name "WBUpStudio.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: WBUpStudio.app not found in DerivedData!"
            exit 1
          fi
          echo "Found compiled app: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package Payload into WB_Up_Studio.ipa
        run: |
          echo "Packaging WB_Up_Studio.ipa..."
          rm -rf ipa_staging WB_Up_Studio.ipa
          mkdir -p ipa_staging/Payload
          cp -R "$APP_PATH" ipa_staging/Payload/
          cd ipa_staging
          zip -r -y ../WB_Up_Studio.ipa Payload
          cd ..
          ls -lh WB_Up_Studio.ipa

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WB_Up_Studio_ipa
          path: WB_Up_Studio.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          name: "WB Up Studio iOS v2.3.0"
          tag_name: "v2.3.0"
          draft: false
          prerelease: false
          files: WB_Up_Studio.ipa
          body: |
            ## 📱 WB Up Studio iOS (.ipa)
            
            Автономная версия **WB Up Studio** для iPhone и iPad.
            
            ### Возможности:
            - ⚡️ **Прямой опрос Wildberries API**: работа напрямую с API WB без внешних серверов.
            - 🎨 **HTML5 Canvas Студия 1080x1080**: вырезка фона, тени, плашки со скидками и ценами.
            - 🚀 **Telegram Bot API**: прямая публикация с кнопками перехода в приложение WB.
            - 💾 **Автономное хранилище**: очередь и настройки хранятся на устройстве.
            
            ### Установка:
            - **Sideloadly** (macOS / Windows): подключите iPhone, перетащите `.ipa` и нажмите Start.
            - **AltStore**: откройте файл `WB_Up_Studio.ipa` в AltStore.
            - Подробное руководство: см. [USAGE_IOS.md](USAGE_IOS.md).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
